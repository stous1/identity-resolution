[project]
name = "identidades"
version = "0.1.0"
description = "Calidad del dato y resolución de identidades de clientes con Splink (caso 1 del portafolio de banca)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sergio Tous" }]
dependencies = [
    "splink>=4,<5",
    "duckdb",
    "pandas",
    "pyarrow",
    "faker",
    "altair",
    "vl-convert-python",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ipykernel",
    "playwright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identidades"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integracion: pruebas del flujo completo (más lentas)",
]
